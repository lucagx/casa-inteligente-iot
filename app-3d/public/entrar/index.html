<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b12" />
  <meta name="robots" content="noindex" />
  <title>Entrar · Casa Inteligente</title>
  <link rel="icon" href="/painel/icones/icone.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/fonts/unbounded/700.css" />
  <link rel="stylesheet" href="/vendor/fonts/dm-sans/400.css" />
  <link rel="stylesheet" href="/vendor/fonts/dm-sans/500.css" />
  <link rel="stylesheet" href="/vendor/fonts/dm-sans/700.css" />
  <link rel="stylesheet" href="/vendor/fonts/jetbrains-mono/400.css" />
  <link rel="stylesheet" href="/entrar/entrar.css" />
</head>

<body>
  <main class="entrar">
    <div class="marca">
      <span class="eyebrow">FEPI · Internet das Coisas e do Comportamento</span>
      <h1>Casa<br />Inteligente</h1>
      <p>
        Gêmeo digital sincronizado com o NodeMCU ESP8266 via Blynk. Entre para controlar a casa e ver
        o painel IoB.
      </p>
    </div>

    <form class="cartao" method="post" action="/entrar">
      <input type="hidden" name="volta" id="volta" value="/" />
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
          required />
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <div class="senha">
          <input id="senha" name="senha" type="password" autocomplete="current-password" required />
          <button type="button" id="ver" aria-label="Mostrar senha" aria-pressed="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>
      <label class="lembrar">
        <input type="checkbox" name="lembrar" value="1" checked />
        Manter conectado neste aparelho (30 dias)
      </label>
      <p class="erro" id="erro" role="alert" hidden></p>
      <button type="submit" class="botao">Entrar</button>
    </form>
    <a class="apresentacao" href="/apresentacao/">Ver a apresentação do projeto →</a>
  </main>
  <script src="/entrar/entrar.js"></script>
</body>

</html>
